[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "x402gate"
version = "0.1.0"
description = "A spending gate for AI agents that pay with x402"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "x402[httpx,evm,fastapi]>=2.23.0,<3",
    "httpx",
    "fastapi",
    "starlette",
    "uvicorn",
    "web3",
    "eth-account",
    "tomli; python_version < '3.11'",
]

[project.scripts]
x402gate = "x402gate.cli:main"

[tool.setuptools]
packages = ["x402gate"]
